
name: Build Frontend EcoTecidos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Descarte_Tecidos

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Descarte_Tecidos/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar build
        run: npm run build
