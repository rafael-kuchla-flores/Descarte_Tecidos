services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: descarte-tecidos-frontend

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

    command: npm run dev -- --host 0.0.0.0

    restart: unless-stopped

volumes:
  frontend_node_modules: